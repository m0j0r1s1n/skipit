<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkipIt Admin</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="/assets/css/style.css" />
  <style>
    body { background: #f5f5f5; padding: 20px; }
  </style>
</head>
<body class="admin-page">

<div id="admin-panel">

  <!-- LOGIN -->
  <div id="login-box" class="admin-login">
    <h1>Skip<span style="color:#e8750a">It</span></h1>
    <p>Admin Dashboard — Staff only</p>
    <form id="login-form">
      <input type="password" id="admin-pass" placeholder="Enter password" required autocomplete="current-password" />
      <button type="submit" class="button" style="width:100%;margin-top:12px">Sign In</button>
      <p class="error-msg" id="login-error"></p>
    </form>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard" style="display:none">

    <div class="admin-header">
      <h1>Skip<span>It</span> &mdash; Bookings &amp; Quotes</h1>
      <div style="display:flex;gap:10px;align-items:center">
        <a href="/" style="color:rgba(255,255,255,0.6);font-size:0.85rem">← Back to site</a>
        <button onclick="adminLogout()">Sign Out</button>
      </div>
    </div>

    <!-- STATS -->
    <div class="admin-stats">
      <div class="stat-card">
        <div class="stat-num" id="booking-count">0</div>
        <div class="stat-label">Total Bookings</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="quote-count">0</div>
        <div class="stat-label">Quote Requests</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="pending-count">0</div>
        <div class="stat-label">Pending Action</div>
      </div>
    </div>

    <!-- BOOKINGS TABLE -->
    <div class="admin-section">
      <div class="admin-section-header">
        <h2>Bookings <span id="booking-count-tag">0</span></h2>
        <button class="clear-btn" onclick="clearData('bookings')">Clear all bookings</button>
      </div>
      <div id="bookings-table"><p class="no-data">No bookings yet.</p></div>
    </div>

    <!-- QUOTES TABLE -->
    <div class="admin-section">
      <div class="admin-section-header">
        <h2>Quote Requests <span id="quote-count-tag">0</span></h2>
        <button class="clear-btn" onclick="clearData('quotes')">Clear all quotes</button>
      </div>
      <div id="quotes-table"><p class="no-data">No quote requests yet.</p></div>
    </div>

    <p style="text-align:center;font-size:0.78rem;color:#aaa;margin-top:10px">
      Data is stored in your browser's local storage. Bookings also arrive by email via Formspree.
    </p>

  </div>
</div>

<script src="/assets/js/app.js"></script>
</body>
</html>
