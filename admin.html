<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- PREVENT SEARCH ENGINE INDEXING -->
<meta name="robots" content="noindex, nofollow">
<title>SkipIt Admin Dashboard</title>
<link rel="stylesheet" href="/assets/css/style.css">
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f6f8; margin: 0; padding: 20px; color: #333; }
  .admin-container { max-width: 1250px; margin: 30px auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
  .login-card { max-width: 400px; margin: 80px auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
  .login-card input { width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
  .login-card button { width: 100%; padding: 12px; background: #e66000; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
  .stat-card { background: #f8f9fa; border: 1px solid #e0e0e0; padding: 20px; border-radius: 8px; text-align: center; }
  .stat-card h3 { margin: 0; font-size: 2rem; color: #e66000; }
  .stat-card p { margin: 5px 0 0; color: #666; font-size: 0.9rem; }
  table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.88rem; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #eee; vertical-align: middle; }
  th { background: #f8f9fa; font-weight: 600; color: #555; }
  code { background: #eee; padding: 2px 6px; border-radius: 4px; font-size: 0.8rem; }
  .header-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
  .btn-danger { background: #d9534f; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
  .btn-logout { background: #6c757d; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
  .error-msg { color: #d9534f; font-size: 0.85rem; margin-top: 5px; }
  a { color: #e66000; text-decoration: none; }
  a:hover { text-decoration: underline; }
  select { padding: 4px 8px; border-radius: 4px; border: 1px solid #ccc; font-size: 0.85rem; }
</style>
</head>
<body>

<div id="admin-panel">

  <!-- LOGIN SECTION -->
  <div id="login-container" class="login-card">
    <h2>SkipIt Admin</h2>
    <p>Please enter your passcode to access the dashboard.</p>
    <form id="login-form">
      <input type="password" id="password-input" placeholder="Enter Admin Password" required />
      <button type="submit">Log In</button>
      <div id="login-error" class="error-msg"></div>
    </form>
  </div>

  <!-- DASHBOARD SECTION -->
  <div id="admin-dashboard" class="admin-container" style="display:none">
    <div class="header-actions">
      <h2>📊 Admin Dashboard</h2>
      <button id="logout-btn" class="btn-logout">Log Out</button>
    </div>

    <!-- METRICS -->
    <div class="stats-grid">
      <div class="stat-card">
        <h3 id="booking-count">0</h3>
        <p>Total Bookings</p>
      </div>
      <div class="stat-card">
        <h3 id="quote-count">0</h3>
        <p>Total Quote Requests</p>
      </div>
      <div class="stat-card">
        <h3 id="pending-count">0</h3>
        <p>Pending Review</p>
      </div>
    </div>

    <!-- BOOKINGS TABLE -->
    <div class="header-actions">
      <h3>📅 Bookings</h3>
      <button class="btn-danger" onclick="clearData('bookings')">Clear Bookings</button>
    </div>
    <div id="bookings-table"></div>

    <br><hr><br>

    <!-- QUOTES TABLE -->
    <div class="header-actions">
      <h3>💬 Quote Requests</h3>
      <button class="btn-danger" onclick="clearData('quotes')">Clear Quotes</button>
    </div>
    <div id="quotes-table"></div>
  </div>

</div>

<!-- REQUIRED SCRIPT -->
<script src="/assets/js/app.js"></script>

</body>
</html>
